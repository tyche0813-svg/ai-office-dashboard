<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI 오피스">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/app/favicon.png">
<link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
<title>AI 오피스</title>
<link rel="stylesheet" href="assets/style.css?v=1116g">
</head>
<body>
<div class="app">
  <main class="map-pane" id="mapPane">
    <div class="map-head">
      <div class="brand"><span class="brand-mark"></span>AI OFFICE <small>실시간 관제탑</small></div>
      <div class="legend" id="legend"></div>
      <div class="ticker" id="ticker" aria-live="polite"></div>
    </div>
    <div class="zoom" role="group" aria-label="확대 축소">
      <button type="button" id="installBtn" class="wide install" hidden>앱 설치</button>
      <button type="button" id="zoomIn" aria-label="확대">+</button>
      <button type="button" id="zoomOut" aria-label="축소">−</button>
      <button type="button" id="zoomFit" class="wide">전체</button>
    </div>
    <svg id="map" class="map" xmlns="http://www.w3.org/2000/svg" viewBox="-385 -160 900 610" preserveAspectRatio="xMidYMid meet" aria-label="2.5D 사무실 지도">
      <g id="world"><g id="floor"></g><g id="sorted"></g><g id="signs"></g><g id="overlay"></g></g>
    </svg>
    <div class="map-msg" id="mapMsg" hidden></div>
    <div class="ios-hint" id="iosHint" hidden>
      <span>앱으로 쓰려면 Safari 아래 <b>공유</b> 버튼 → <b>홈 화면에 추가</b>를 누르세요.</span>
      <button type="button" id="iosHintClose" aria-label="안내 닫기">×</button>
    </div>
    <div class="popup" id="popup" hidden role="dialog" aria-modal="false" aria-labelledby="popName">
      <button type="button" class="popup-close" id="popClose" aria-label="닫기">×</button>
      <div class="popup-head">
        <span class="avatar" id="popAvatar"></span>
        <div>
          <div class="popup-name" id="popName"></div>
          <div class="popup-role" id="popRole"></div>
        </div>
        <span class="badge" id="popBadge"></span>
      </div>
      <dl class="popup-meta" id="popMeta"></dl>
      <div class="popup-sub" id="popSub">작업 로그</div>
      <ul class="loglist" id="popLogs"></ul>
    </div>
  </main>

  <aside class="side">
    <header class="side-head">
      <span class="live" id="liveDot"><i></i><span id="liveText">LIVE</span></span>
      <span class="side-title">관제탑</span>
      <span class="clock" id="clock"></span>
    </header>
    <section class="kpis">
      <div class="kpi"><b id="kDone">–</b><span>오늘 처리</span></div>
      <div class="kpi"><b id="kWork">–</b><span>일하는 AI</span></div>
      <div class="kpi"><b id="kIdle">–</b><span>대기 AI</span></div>
      <div class="kpi"><b id="kAll">–</b><span>진행 일감</span></div>
    </section>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="tower" class="on">관제탑</button>
      <button type="button" role="tab" data-tab="agents">AI 전체</button>
      <button type="button" role="tab" data-tab="tasks">일감</button>
      <button type="button" role="tab" data-tab="logs">활동 로그</button>
    </nav>
    <section class="tabbody" id="tabBody"></section>
    <footer class="side-foot">
      <div class="foot-title">status 갱신 시각</div>
      <div id="footStatus" class="foot-rows"></div>
    </footer>
  </aside>
</div>
<script src="assets/app.js?v=1116g"></script>
</body>
</html>
